{# FAQPage schema for the regular (non-medical) Hebrew site. #}
{% if not qs_is_en %}
{% from "snippets/hebrew_faq_data.html" import faq_items %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "inLanguage": "he",
  "mainEntity": [
    {%- for item in faq_items %}
    {
      "@type": "Question",
      "name": {{ item.q | tojson }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ item.a | tojson }}
      }
    }{% if not loop.last %},{% endif %}
    {%- endfor %}
  ]
}
</script>
{% endif %}
