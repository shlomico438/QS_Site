<section class="medical-pricing-section" id="medical-pricing-section" aria-labelledby="medical-pricing-title">
    <h2 id="medical-pricing-title" data-i18n="medical_pricing_title">Simple plans by transcription hours</h2>
    <div class="medical-pricing-grid">
        <article class="medical-pricing-card">
            <h3>Starter</h3>
            <div class="medical-plan-price"><span data-i18n="medical_plan_price_starter">$75</span> <small data-i18n="medical_plan_per_month">/ month</small></div>
            <strong data-i18n="medical_plan_hours_starter">30 transcription hours per month</strong>
            <button type="button" data-medical-plan="starter" data-i18n="medical_plan_select_starter">Choose Starter</button>
        </article>
        <article class="medical-pricing-card is-recommended">
            <span class="medical-recommended-badge" data-i18n="medical_plan_recommended">Recommended</span>
            <h3>Professional</h3>
            <div class="medical-plan-price"><span data-i18n="medical_plan_price_professional">$125</span> <small data-i18n="medical_plan_per_month">/ month</small></div>
            <strong data-i18n="medical_plan_hours_professional">60 transcription hours per month</strong>
            <button type="button" data-medical-plan="professional" data-i18n="medical_plan_select_professional">Choose Professional</button>
        </article>
        <article class="medical-pricing-card">
            <h3>Clinic</h3>
            <div class="medical-plan-price"><span data-i18n="medical_plan_price_clinic">$350</span> <small data-i18n="medical_plan_per_month">/ month</small></div>
            <strong data-i18n="medical_plan_hours_clinic">180 transcription hours per month</strong>
            <span data-i18n="medical_plan_seats_clinic">Up to 5 professionals</span>
            <button type="button" data-medical-plan="clinic" data-i18n="medical_plan_select_clinic">Choose Clinic</button>
        </article>
    </div>
    <p class="medical-overage-note" data-i18n="medical_overage_note">Additional transcription beyond quota: $3 per hour.</p>
</section>
